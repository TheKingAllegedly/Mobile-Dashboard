name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check the paths the app loads at runtime
        run: node scripts/check-asset-paths.mjs

      - name: Run tests
        run: npm test

  android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check the dashboard was bundled into the APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          missing=0
          for entry in \
            assets/web/index.html \
            assets/web/js/main.js \
            assets/web/js/core/registry.js \
            assets/web/css/app.css \
            assets/web/manifest.webmanifest \
            res/xml/dashboard_widget_info.xml
          do
            if unzip -l "$apk" | grep -q "$entry"; then
              echo "found    $entry"
            else
              echo "MISSING  $entry"
              missing=1
            fi
          done
          sources=$(unzip -l "$apk" | grep -c 'assets/web/js/sources/')
          echo "card sources bundled: $sources"
          if [ "$sources" -lt 14 ]; then
            echo "expected at least 14 card sources in the APK"
            missing=1
          fi
          exit $missing

      - name: Name the APK after the commit
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/dashboard-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
